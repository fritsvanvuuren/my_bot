teleop_twist_joy:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.7
    scale_linear_turbo:
      x: 1.0

    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.7
    scale_angular_turbo:
      yaw: 1.0

    enable_button: 6   # L2 on a PS4 controller
    enable_turbo_button: 4  # L1 on a PS4 controller
    require_enable_button: true
